server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ranola_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: RaNoLaNFTMarketplaceSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024
    expiration-ms: 86400000  # 24 hours

  file:
    upload-dir: ./uploads
